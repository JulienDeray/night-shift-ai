name: happy-path-agent
description: Single-step agent for E2E happy-path testing
steps:
  - name: run
    prompt: prompts/run.md
    timeout: "30s"
    outputSchema:
      type: object
      properties:
        result:
          type: string
      required: [result]
    env:
      - name: MOCK_CLAUDE_RESPONSE_FILE
        value: "{{response_file}}"
