name: code-agent
description: Analyzes a repository nightly and creates a focused improvement MR

model: claude-opus-4-6
timeout: 30m
allowedTools:
  - Bash
  - Read
  - Write
  - Edit
  - Glob
  - Grep

variables:
  repo_url: ""
  category: ""
  category_guidance: ""
  confluence_page_id: ""
  mcp_config_path: ""
  reviewer: ""
  allowed_commands: "git, glab"
  retry_error: ""

beads:
  - name: clone
    type: git-clone
    prompt: prompts/clone-stub.md
    env:
      - GITLAB_TOKEN
    outputSchema:
      type: object
      properties:
        repoDir:
          type: string
        handoffDir:
          type: string
      required:
        - repoDir
        - handoffDir

  - name: analyze
    type: standard
    prompt: prompts/analyze.md
    model: claude-opus-4-6
    outputSchema:
      type: object
      properties:
        result:
          type: string
          enum:
            - IMPROVEMENT_FOUND
            - NO_IMPROVEMENT
        categoryUsed:
          type: string
        reason:
          type: string
        candidates:
          type: array
          items:
            type: object
            properties:
              rank:
                type: integer
              files:
                type: array
                items:
                  type: string
              description:
                type: string
              rationale:
                type: string
        selected:
          type: object
          properties:
            rank:
              type: integer
            files:
              type: array
              items:
                type: string
            description:
              type: string
            rationale:
              type: string
      required:
        - result
        - categoryUsed

  - name: implement
    type: standard
    prompt: prompts/implement.md
    model: claude-opus-4-6
    outputSchema:
      type: object
      properties:
        status:
          type: string
          enum:
            - IMPLEMENTED
      required:
        - status

  - name: verify
    type: standard
    prompt: prompts/verify.md
    model: claude-sonnet-4-6
    retry:
      maxAttempts: 3
      retryFrom: implement
    outputSchema:
      type: object
      properties:
        passed:
          type: boolean
        error_details:
          type: string
      required:
        - passed

  - name: mr
    type: standard
    prompt: prompts/mr.md
    model: claude-sonnet-4-6
    env:
      - GITLAB_TOKEN
    outputSchema:
      type: object
      properties:
        mr_url:
          type: string
        outcome:
          type: string
          enum:
            - MR_CREATED
            - MR_FAILED
      required:
        - outcome

  - name: log
    type: standard
    prompt: prompts/log.md
    model: claude-sonnet-4-6
    timeout: 2m
    mcpConfig: "{{mcp_config_path}}"
    allowedTools:
      - mcp__atlassian__getAccessibleAtlassianResources
      - mcp__atlassian__getConfluencePage
      - mcp__atlassian__updateConfluencePage
      - Read
    outputSchema:
      type: object
      properties:
        logged:
          type: boolean
      required:
        - logged
